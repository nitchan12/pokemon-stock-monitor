<!--
  Synthetic fixture covering defensive branches in parser._parse_tile /
  _extract_url / _extract_price that a well-formed live page never
  exercises: a tile with no data-pid, a tile with no name, a tile with no
  href, a tile with an absolute (already-full) product URL, and a tile
  with an unparseable price string.
-->
<html>
<body>
  <div class="search-results">
    <div class="product-grid-wrapper">
      <div class="row product-grid">

        <!-- no data-pid at all: must be skipped -->
        <div class="card product-tile product-data product">
          <div class="card-body">
            <a class="card-link -plain" href="/th-th/no-pid.html"><span>No Pid Product</span></a>
          </div>
        </div>

        <!-- data-pid present, but no name span: must be skipped -->
        <div class="card product-tile product-data product" data-pid="11111111">
          <div class="card-body">
            <a class="card-link -plain" href="/th-th/no-name.html"></a>
          </div>
        </div>

        <!-- data-pid + name present, but no href: must be skipped -->
        <div class="card product-tile product-data product" data-pid="22222222">
          <div class="card-body">
            <a class="card-link -plain"><span>No Url Product</span></a>
          </div>
        </div>

        <!-- absolute URL should be preserved as-is, not re-prefixed -->
        <div class="card product-tile product-data product" data-pid="33333333">
          <div class="card-body">
            <a class="card-link -plain" href="https://www.toysrus.co.th/th-th/absolute-url-product.html">
              <span>Absolute Url Product</span>
            </a>
          </div>
          <div class="card-footer">
            <div class="price"><span class="price-items"><span class="sales"><span class="value">฿100</span></span></span></div>
          </div>
        </div>

        <!-- unparseable price text after cleaning (multiple decimal points) -->
        <div class="card product-tile product-data product" data-pid="44444444">
          <div class="card-body">
            <a class="card-link -plain" href="/th-th/bad-price-product.html"><span>Bad Price Product</span></a>
          </div>
          <div class="card-footer">
            <div class="price"><span class="price-items"><span class="sales"><span class="value">12.34.56</span></span></span></div>
          </div>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
